name: KOReader OTA zsync archive digest validation
on:
  push:
    branches: [build/pw3-alpine-integrated]
    paths: [.github/workflows/pw3-koreader-ota-sha1-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check official OTA SHA1 against published compressed archive
        run: |
          set -euo pipefail
          base=https://ota.koreader.rocks
          file=koreader-kindlepw2-v2026.07.2.targz
          curl -fsSL --retry 3 "$base/koreader-kindlepw2-latest-stable.zsync" -o index.zsync
          curl -fsSL --retry 3 "$base/$file" -o "$file"
          sha1sum "$file"
          echo "=== Uncompressed tar SHA-1 ==="
          gzip -dc "$file" | sha1sum
          echo "=== OTA metadata ==="
          head -n 9 index.zsync
          echo "=== compressed archive ==="
          ls -lh "$file"
          file "$file"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,tarfile
          m=Path('index.zsync').read_bytes().split(b'\n\n',1)[0]
          d=dict(line.decode().split(': ',1) for line in m.splitlines() if b': ' in line)
          p=Path('koreader-kindlepw2-v2026.07.2.targz')
          actual=hashlib.sha1(p.read_bytes()).hexdigest()
          expected=d.get('SHA-1','')
          print('SHA1_CHECK',actual,expected,'MATCH' if actual==expected else 'MISMATCH')
          with tarfile.open(p) as t:
              a=t.getmembers()
              print('MEMBERS',len(a))
              print('ROOTS',sorted({x.name.split('/')[0] for x in a})[:12])
          PY
          echo "=== Verify actual stable update is compatible with persistent userpatch ==="
          tar -xOf "$file" koreader/reader.lua | grep -F 'userpatch.applyPatches(userpatch.late)'
          tar -xOf "$file" koreader/frontend/userpatch.lua | grep -F 'function userpatch.applyPatches'
          tar -xOf "$file" koreader/frontend/ui/otamanager.lua | grep -F 'getOTAMenuTable'
          echo "=== Verify updater can inspect real stable archive ==="
          python3 - <<'PY'
          import importlib.util, tempfile, pathlib, hashlib, gzip
          script=pathlib.Path('build/pw3os/koreader_update.py')
          spec=importlib.util.spec_from_file_location('updater',script)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as work:
              wd=pathlib.Path(work)
              mod.CACHE=wd/'cache';mod.LOG=mod.CACHE/'log'
              archive=pathlib.Path('koreader-kindlepw2-v2026.07.2.targz')
              with gzip.open(archive,'rb') as f: raw=f.read()
              expected='eb224da4b213b56766c9988e97d3de285ce004cd'
              assert hashlib.sha1(raw).hexdigest()==expected,'Official OTA tar digest changed'
              meta={'tar_sha1':expected,'tar_size':len(raw)}
              mod.verified_tar(archive,meta)
              mod.unpack(archive,wd/'ko')
              assert (wd/'ko/git-rev').read_text().strip().startswith('v2026.07.2')
              print('RESULT: REAL_STABLE_OTA_UPDATER_VALIDATION_PASS')
          PY

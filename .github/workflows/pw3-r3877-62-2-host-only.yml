name: PW3 R3877.62.2 host-only recovery candidate triage
on:
  push:
    paths:
      - 'research/r3877-62-2/**'
      - '.github/workflows/pw3-r3877-62-2-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-62-2/**'
      - '.github/workflows/pw3-r3877-62-2-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run offline scanner tests and no-scan HOLD
        working-directory: research/r3877-62-2
        shell: bash
        run: |
          set -eu
          shasum -a 256 -c SHA256SUMS_R3877_62_2.txt
          python3 -B -m unittest -q test_r3877_62.py test_r3877_62_2.py
          set +e
          python3 -B pw3_r3877_62_2_candidate_triage.py > preflight.json
          code=$?
          set -e
          test "$code" -eq 2
          python3 - <<'PY'
          import json
          r=json.load(open('preflight.json'))
          assert r['result']=='HOLD'
          assert r['hold_category']=='EXPLICIT_LOCAL_DIRECTORY_REQUIRED'
          assert r['immutable_hold']=='NOT_BOOTABLE'
          assert r['physical_device_access_performed'] is False
          assert r['docker_used'] is False
          PY

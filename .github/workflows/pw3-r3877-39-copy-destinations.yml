name: R3877.39 copy destinations offline regressions
on:
  push:
    branches:
      - main
      - research/r3877-17-2-nobits-parser-fix
    paths:
      - 'research/r3877-38/**'
      - 'research/r3877-39/**'
      - '.github/workflows/pw3-r3877-39-copy-destinations.yml'
  pull_request:
    paths:
      - 'research/r3877-38/**'
      - 'research/r3877-39/**'
      - '.github/workflows/pw3-r3877-39-copy-destinations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-only regressions; no real log or Kindle
        working-directory: research/r3877-39
        run: |
          python3 -B -m unittest -q test_r3877_31.py test_r3877_32.py test_r3877_32_1.py test_r3877_32_2.py test_r3877_33.py test_r3877_33_1.py test_r3877_34.py test_r3877_35.py test_r3877_36.py test_r3877_37.py test_r3877_38.py test_r3877_39.py
      - name: Missing public build log must hold; no device operations
        working-directory: research/r3877-39
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          p=subprocess.run([sys.executable,'-B','pw3_r3877_39_copy_dest_consumer_audit.py',
                '/not-mounted/public-armv7-musl.log'],capture_output=True,text=True)
          assert p.returncode == 2
          d=json.loads(p.stdout)
          assert d['result']=='HOLD'
          assert d['hold_category']=='LOG_FILE_MISSING_OR_SYMLINK'
          assert d['immutable_hold']=='NOT_BOOTABLE'
          assert d['kindle_ssh_sessions']==0
          print('MISSING_LOG_HOLD_OK')
          PY

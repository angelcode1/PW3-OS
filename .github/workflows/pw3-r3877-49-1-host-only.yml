name: PW3 R3877.49.1 host-only QEMU trace output diagnostics
on:
  pull_request:
    paths:
      - 'research/r3877-49-1/**'
      - '.github/workflows/pw3-r3877-49-1-host-only.yml'
  push:
    branches:
      - main
      - research/r3877-17-2-nobits-parser-fix
    paths:
      - 'research/r3877-49-1/**'
      - '.github/workflows/pw3-r3877-49-1-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-host-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic parser and lifecycle tests (no Docker or Kindle)
        run: |
          cd research/r3877-49-1
          python3 -B -m unittest -q test_r3877_49_1.py
      - name: Confirm default zero-Docker preflight HOLD
        run: |
          cd research/r3877-49-1
          set +e
          python3 -B pw3_r3877_49_1_trace_output_diagnostic.py > /tmp/pw3_r491_preflight.json
          rc=$?
          test "$rc" -eq 2 || exit 1
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pw3_r491_preflight.json'))
          assert p['result']=='HOLD'
          assert p['immutable_hold']=='NOT_BOOTABLE'
          assert p['authorized_qemu_execution_performed'] is False
          assert p['boot_performed'] is False
          assert p['physical_device_access_performed'] is False
          assert p['firmware_write_performed'] is False
          print('R3877_49_1_DEFAULT_PREFLIGHT_HOLD_PASS')
          PY

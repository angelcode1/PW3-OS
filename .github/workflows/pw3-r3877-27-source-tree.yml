name: R3877.27 pinned musl source tree offline tests
on:
  pull_request:
    paths:
      - 'research/r3877-26-1/**'
      - 'research/r3877-27/**'
      - '.github/workflows/pw3-r3877-27-source-tree.yml'
  push:
    branches:
      - main
      - research/r3877-17-2-nobits-parser-fix
    paths:
      - 'research/r3877-26-1/**'
      - 'research/r3877-27/**'
      - '.github/workflows/pw3-r3877-27-source-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R3877.26.1 and 27 synthetic regression tests (no SSH, no ARM execution)
        working-directory: research/r3877-27
        run: |
          python3 -B -m unittest -q test_r3877_26.py test_r3877_26_1.py test_r3877_27.py
      - name: R3877.27 missing inputs must hold without Kindle contact
        working-directory: research/r3877-27
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.run(
              [sys.executable, '-B', 'pw3_r3877_27_patched_tree_fingerprint.py',
               '--source-dir', '/missing/pw3-r3877-27'],
              check=False, capture_output=True, text=True)
          assert p.returncode == 2
          o = json.loads(p.stdout)
          assert o['result'] == 'HOLD'
          assert o['immutable_hold'] == 'NOT_BOOTABLE'
          assert o['kindle_ssh_sessions'] == 0
          assert o['patched_source_to_binary_reproducibility_verified'] is False
          print('OFFLINE_ONLY_NOT_BOOTABLE')
          PY

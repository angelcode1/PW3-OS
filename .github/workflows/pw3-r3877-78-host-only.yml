name: PW3 R3877.78 Alpine musl smoke host-only
on:
  push:
    paths:
      - 'research/r3877-78/**'
      - '.github/workflows/pw3-r3877-78-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-78/**'
      - '.github/workflows/pw3-r3877-78-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-host-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: research/r3877-78
    steps:
      - uses: actions/checkout@v4
      - name: Check source hashes and run synthetic tests without downloading Alpine
        shell: bash
        run: |
          set -eu
          shasum -a 256 -c SHA256SUMS_R3877_78.txt
          python3 -B -m unittest -q test_r3877_78.py
      - name: Assert mandatory no-opt-in HOLD without a network connection
        shell: bash
        run: |
          set +e
          python3 -B pw3_r3877_78_musl_runtime.py > preflight.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          j=json.load(open('preflight.json'))
          assert j['result']=='HOLD' and j['immutable_hold']=='NOT_BOOTABLE'
          assert j['hold_category']=='DEVICE_MUSL_TEST_NOT_AUTHORIZED'
          assert not j['device_execution_attempted']
          assert not j['firmware_write_performed']
          PY

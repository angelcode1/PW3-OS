name: PW3 R3877.62 host-only recovery inventory tests
on:
  push:
    paths:
      - 'research/r3877-62/**'
      - '.github/workflows/pw3-r3877-62-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-62/**'
      - '.github/workflows/pw3-r3877-62-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no-network host-only Python tests
        working-directory: research/r3877-62
        run: |
          set -eu
          sha256sum -c SHA256SUMS_R3877_62.txt
          python3 -B -m unittest -q test_r3877_62.py
          set +e
          python3 -B pw3_r3877_62_recovery_inventory.py > preflight.json
          code=$?
          set -e
          test "$code" -eq 2
          python3 - <<'PY'
          import json
          o=json.load(open('preflight.json'))
          assert o['result']=='HOLD'
          assert o['hold_category']=='EXPLICIT_LOCAL_DIRECTORY_REQUIRED'
          assert o['immutable_hold']=='NOT_BOOTABLE'
          assert o['physical_device_access_performed'] is False
          PY

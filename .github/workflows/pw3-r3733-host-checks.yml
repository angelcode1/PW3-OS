name: PW3 R3733 read-only interpreter layout host checks

on:
  push:
    paths:
      - 'research/r40.4.3.7.33/**'
      - '.github/workflows/pw3-r3733-host-checks.yml'
  pull_request:
    paths:
      - 'research/r40.4.3.7.33/**'
      - '.github/workflows/pw3-r3733-host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python compile check
        run: python3 -m py_compile research/r40.4.3.7.33/R4043733-INTERP-LAYOUT-READONLY.py
      - name: Run 14 synthetic tests
        run: python3 -m unittest discover -s research/r40.4.3.7.33 -p 'test_r4043733.py' -v

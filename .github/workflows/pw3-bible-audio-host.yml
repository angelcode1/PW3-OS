name: PW3 Bible audio and public verse-stream host checks
on:
  push:
    branches:
      - feature/pw3-bible-reader
    paths:
      - 'apps/pw3-bible/**'
      - 'tests/test_pw3_audio_*.py'
      - 'tests/test_pw3_online_verse.py'
      - '.github/workflows/pw3-bible-audio-host.yml'
  pull_request:
    paths:
      - 'apps/pw3-bible/**'
      - 'tests/test_pw3_audio_*.py'
      - 'tests/test_pw3_online_verse.py'
      - '.github/workflows/pw3-bible-audio-host.yml'
jobs:
  offline-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check audio controller syntax
        run: python3 -m py_compile apps/pw3-bible/audio_control.py
      - name: Test streaming resolver syntax
        run: python3 -m py_compile apps/pw3-bible/audio_stream.py
      - name: Test offline audio gating and archive metadata
        run: |
          python3 -m unittest discover -s tests -p 'test_pw3_audio_player.py' -v
          python3 -m unittest discover -s tests -p 'test_pw3_audio_archive.py' -v
          python3 -m unittest discover -s tests -p 'test_pw3_audio_catalog.py' -v
          python3 -m unittest discover -s tests -p 'test_pw3_audio_stream.py' -v
      - name: Test public CDN verse stream without network
        run: |
          python3 -m py_compile apps/pw3-bible/online_verse.py
          python3 -m unittest discover -s tests -p 'test_pw3_online_verse.py' -v
      - name: Compile host reader
        run: cc -O2 -Wall -Wextra -DPW3_HOST apps/pw3-bible/reader.c -o /tmp/pw3-reader-host
      - name: Syntax-check Kindle reader code
        run: cc -O2 -Wall -Wextra -fsyntax-only apps/pw3-bible/reader.c

name: PW3 R3877.83 glibc LuaJIT smoke host-only
on:
  push:
    paths:
      - 'research/r3877-83/**'
      - '.github/workflows/pw3-r3877-83-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-83/**'
      - '.github/workflows/pw3-r3877-83-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-offline-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: research/r3877-83
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact original published package hashes
        shell: bash
        run: shasum -a 256 -c SHA256SUMS_R3877_83.txt
      - name: Synthetic Python regression tests
        run: python3 -B -m unittest -q test_r3877_83.py
      - name: Default blocks device execution
        shell: bash
        run: |
          set +e
          python3 -B pw3_r3877_83_glibc_luajit_smoke.py --stage /nonexistent > refusal.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          j=json.load(open('refusal.json'))
          assert j['result']=='HOLD'
          assert j['immutable_hold']=='NOT_BOOTABLE'
          assert j['kindle_access_performed'] is False
          assert j['device_execution_attempted'] is False
          PY

name: R3877.32.1 pinned public log offline regressions
on:
  push:
    branches:
      - main
      - research/r3877-17-2-nobits-parser-fix
    paths:
      - 'research/r3877-31/**'
      - 'research/r3877-32/**'
      - 'research/r3877-32-1/**'
      - '.github/workflows/pw3-r3877-32-1-link-lexical.yml'
  pull_request:
    paths:
      - 'research/r3877-31/**'
      - 'research/r3877-32/**'
      - 'research/r3877-32-1/**'
      - '.github/workflows/pw3-r3877-32-1-link-lexical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic, no-public-log regression tests
        working-directory: research/r3877-32-1
        run: |
          python3 -B -m unittest -q test_r3877_31.py test_r3877_32.py test_r3877_32_1.py
      - name: Refuse missing log; no SSH or ARM execution
        working-directory: research/r3877-32-1
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.run([sys.executable, '-B',
               'pw3_r3877_32_1_link_lexical_diagnostic.py',
               '/not-mounted/pw3-r3877-30.log'],
               check=False, text=True, capture_output=True)
          assert p.returncode == 2
          d = json.loads(p.stdout)
          assert d['result'] == 'HOLD'
          assert d['kindle_ssh_sessions'] == 0
          assert d['immutable_hold'] == 'NOT_BOOTABLE'
          print('OFFLINE_NO_TARGET_ACCESS_PASS')
          PY

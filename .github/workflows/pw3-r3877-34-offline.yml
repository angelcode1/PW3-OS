name: PW3 R3877.34 offline build-log structure tests
on:
  push:
    branches:
      - main
      - research/r3877-17-2-nobits-parser-fix
    paths:
      - 'research/r3877-33-1/**'
      - 'research/r3877-34/**'
      - '.github/workflows/pw3-r3877-34-offline.yml'
  pull_request:
    paths:
      - 'research/r3877-33-1/**'
      - 'research/r3877-34/**'
      - '.github/workflows/pw3-r3877-34-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic log and safety regressions only
        working-directory: research/r3877-34
        run: |
          python3 -B -m unittest -q \
            test_r3877_31.py test_r3877_32.py test_r3877_32_1.py \
            test_r3877_32_2.py test_r3877_33.py test_r3877_33_1.py \
            test_r3877_34.py
      - name: Missing public log is an explicit safe HOLD
        working-directory: research/r3877-34
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          r = subprocess.run([sys.executable, '-B',
            'pw3_r3877_34_pinned_link_structure.py',
            '/unmounted/expected-r3877-30-build-log.txt'],
            text=True, capture_output=True, check=False)
          assert r.returncode == 2
          data=json.loads(r.stdout)
          assert data['result'] == 'HOLD'
          assert data['immutable_hold'] == 'NOT_BOOTABLE'
          assert data['kindle_ssh_sessions'] == 0
          assert data['source_to_binary_reproducibility_verified'] is False
          print('OFFLINE_MISSING_LOG_HOLD_PASS')
          PY

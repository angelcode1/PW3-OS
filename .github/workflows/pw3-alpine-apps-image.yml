name: PW3-OS Alpine 3.24.3 image with Bible, KOReader and puzzles
on:
  push:
    branches:
      - feature/pw3-bible-reader
      - build/pw3-alpine-integrated
      - feature/codex-branding-browser
    paths:
      - 'build/pw3os/**'
      - 'apps/pw3-bible/**'
      - '.github/workflows/pw3-alpine-apps-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Test image builder and puzzle logic
        run: |
          python3 -m unittest discover -s build/pw3os -p 'test_*.py' -v
          cc -DPW3_HOST_TEST -Wall -Wextra -Werror build/pw3os/puzzles.c -o /tmp/pw3-puzzles-test
          /tmp/pw3-puzzles-test --selftest
      - name: Build builder container
        run: docker build --platform linux/amd64 -t pw3os-builder -f build/pw3os/Dockerfile build/pw3os
      - name: Build complete Alpine image and boot bundle
        run: |
          mkdir -p out/pw3os
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" -v "$PWD/out/pw3os:/output" \
            pw3os-builder --output /output
      - name: Check images and bundle manifest
        run: |
          cd out/pw3os
          sha256sum -c SHA256SUMS
          test -s alpine-os.img
          test -s pw3os-boot-once.sh
          test -s pw3-debugmount
          test -s BUILD-MANIFEST.json
          test -s README-DEPLOY.txt
          test -s home
          test -s codex-browser
          test -s libcodex-sdl-capture.so
          test -s verify_direct_sdl.py
          file libcodex-sdl-capture.so | grep -E 'ELF 32-bit.*ARM.*shared object'
          test -s codex-display-probe
          test -s codex-browser-panel-preview
          test -s codex-browser-touch-probe
          test -s codex-netsurf-test-bundle.tar.gz
          tar -tzf codex-netsurf-test-bundle.tar.gz | grep -Fx usr/bin/netsurf-framebuffer
          tar -tzf codex-netsurf-test-bundle.tar.gz | grep -Fx codex-browser-trial.sh
          python3 - <<'PY'
          import json
          with open('BUILD-MANIFEST.json') as f:
              manifest=json.load(f)
          browser=manifest['browser']
          assert browser['name']=='netsurf-framebuffer',browser
          assert browser['version']=='3.11-r1',browser
          assert browser['state']=='staged-unverified',browser
          assert browser['arm_elf_verified'] and not browser['epdc_verified'],browser
          assert browser['headless_capture_staged'] and not browser['headless_on_device_verified'],browser
          print('CODEX_NETSURF_PACKAGE_STAGED_UNVERIFIED_PASS')
          PY
      - name: Upload small live-app overlay (no Alpine image)
        uses: actions/upload-artifact@v4
        with:
          name: pw3os-apps-overlay
          path: |
            out/pw3os/apps
            out/pw3os/home
            out/pw3os/codex-display-probe
            out/pw3os/codex-browser-panel-preview
            out/pw3os/codex-browser-touch-probe
            out/pw3os/pw3-games
            out/pw3os/pw3-koreader
            out/pw3os/settings
            out/pw3os/codex-browser
            out/pw3os/libcodex-sdl-capture.so
            out/pw3os/verify_direct_sdl.py
            out/pw3os/koreader_update.py
            out/pw3os/2-pw3os-autoupdate.lua
          retention-days: 14
          if-no-files-found: error
      - name: Upload small boot and PTY fix bundle (without 768 MiB image)
        uses: actions/upload-artifact@v4
        with:
          name: pw3os-devpts-boot-fix
          path: |
            out/pw3os/pw3-debugmount
            out/pw3os/pw3os-boot-once.sh
          retention-days: 14
          if-no-files-found: error
      - name: Upload isolated NetSurf ARMv7 RAM trial bundle
        uses: actions/upload-artifact@v4
        with:
          name: codex-netsurf-armv7-trial
          path: |
            out/pw3os/codex-netsurf-test-bundle.tar.gz
            out/pw3os/BUILD-MANIFEST.json
            out/pw3os/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Upload full image and boot files
        uses: actions/upload-artifact@v4
        with:
          name: pw3os-alpine-3243-bible-koreader-puzzles
          path: out/pw3os/
          retention-days: 14
          if-no-files-found: error

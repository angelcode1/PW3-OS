name: PW3 R3877.49.2 independent applet controls (host-only)
on:
  push:
    branches: [main, research/r3877-17-2-nobits-parser-fix]
    paths:
      - 'research/r3877-49-2/**'
      - '.github/workflows/pw3-r3877-49-2-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-49-2/**'
      - '.github/workflows/pw3-r3877-49-2-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic regression tests only (no Docker, QEMU or Kindle)
        run: |
          cd research/r3877-49-2
          python3 -B -m unittest -q test_r3877_49_2.py
      - name: Default preflight must HOLD without Docker
        run: |
          cd research/r3877-49-2
          set +e
          python3 -B pw3_r3877_49_2_controlled_trace.py > /tmp/r492_preflight.json
          rc=$?
          test "$rc" -eq 2 || exit 1
          python3 - <<'PYCHECK'
          import json
          d=json.load(open('/tmp/r492_preflight.json'))
          assert d['result']=='HOLD'
          assert d['immutable_hold']=='NOT_BOOTABLE'
          assert d['authorized_qemu_execution_performed'] is False
          assert d['physical_device_access_performed'] is False
          assert d['boot_performed'] is False
          print('R3877_49_2_HOST_ONLY_EXPECTED_HOLD')
          PYCHECK

name: PW3 R3877.57 host-only ELF applet-name audit
on:
  push:
    branches: [research/r3877-17-2-nobits-parser-fix]
    paths:
      - 'research/r3877-57/**'
      - '.github/workflows/pw3-r3877-57-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-57/**'
      - '.github/workflows/pw3-r3877-57-host-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/r3877-57
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned release file hashes
        run: sha256sum -c SHA256SUMS_R3877_57.txt
      - name: Syntax and offline synthetic regression tests
        run: |
          python3 -B -m py_compile pw3_r3877_57_elf_applet_names.py test_r3877_57.py
          python3 -B -m unittest -q test_r3877_57.py
      - name: No-Docker default must HOLD
        run: |
          set +e
          python3 -B pw3_r3877_57_elf_applet_names.py > /tmp/r57-preflight.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r57-preflight.json'))
          assert d['result']=='HOLD'
          assert d['immutable_hold']=='NOT_BOOTABLE'
          assert d['docker_used'] is False
          assert d['physical_device_access_performed'] is False
          assert d['arm_executable_launched'] is False
          PY

name: PW3 R3877.59.1 QEMU ARM failure diagnostic host-only
on:
  push:
    paths:
      - 'research/r3877-59-1/**'
      - '.github/workflows/pw3-r3877-59-1-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-59-1/**'
      - '.github/workflows/pw3-r3877-59-1-host-only.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/r3877-59-1
    steps:
      - uses: actions/checkout@v4
      - name: Decode pinned ARM ELF for metadata-only fixture tests
        run: |
          python3 - <<'PY'
          import base64,hashlib,pathlib
          p=pathlib.Path('pw3_r3877_59_armv7_probe.elf.b64')
          source=p.read_text().strip()
          assert len(source)<12000
          b=base64.b64decode(source,validate=True)
          assert len(b)==4288
          assert hashlib.sha256(b).hexdigest()=='5ce343387f982330965aa1d101daf15d1d53fd38de329d8e7c14a30d6cd37085'
          pathlib.Path('pw3_r3877_59_armv7_probe.elf').write_bytes(b)
          PY
      - name: Verify pinned release checksums
        run: sha256sum -c SHA256SUMS_R3877_59_1.txt
      - name: All host-only synthetic tests; NO Docker / QEMU
        run: python3 -B -m unittest -q test_r3877_49_3.py test_r3877_59.py test_r3877_59_1.py
      - name: Default HOLD; zero Docker, no ARM execution
        run: |
          set +e
          python3 -B pw3_r3877_59_1_failure_diagnostic.py > preflight.json
          code=$?
          test "$code" -eq 2
          python3 - <<'PY'
          import json
          d=json.load(open('preflight.json'))
          assert d['result']=='HOLD' and d['docker_used'] is False
          assert d['immutable_hold']=='NOT_BOOTABLE'
          PY

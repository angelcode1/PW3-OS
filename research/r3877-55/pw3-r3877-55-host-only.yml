name: PW3 R3877.55 host-only BusyBox source audit tests
on:
  push:
    paths:
      - 'research/r3877-55/**'
      - '.github/workflows/pw3-r3877-55-host-only.yml'
  pull_request:
    paths:
      - 'research/r3877-55/**'
      - '.github/workflows/pw3-r3877-55-host-only.yml'
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic host-only tests; never download source or run Docker
        working-directory: research/r3877-55
        run: python3 -B -m unittest -q test_r3877_55.py
      - name: Expected preflight HOLD without any source input
        working-directory: research/r3877-55
        shell: bash
        run: |
          set +e
          python3 -B pw3_r3877_55_busybox_seedrng_source_audit.py > /tmp/r55-preflight.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/r55-preflight.json'))
          assert r['result']=='HOLD'
          assert r['immutable_hold']=='NOT_BOOTABLE'
          assert not r['docker_used']
          assert r['kindle_ssh_sessions']==0
          PY
